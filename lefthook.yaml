pre-commit:
  jobs:
    - name: github actions checks
      group:
        parallel: true
        jobs:
          - name: actionlint
            glob: '.github/workflows/*.{yml,yaml}'
            run: mise exec -- actionlint {staged_files}
          - name: ghasec
            glob: '.github/workflows/*.{yml,yaml}'
            run: mise exec -- ghasec {staged_files}
          - name: ghalint
            glob: '.github/workflows/*.{yml,yaml}'
            run: mise exec -- ghalint run
          - name: pinact
            glob: '.github/workflows/*.{yml,yaml}'
            run: mise exec -- pinact run --fix=false --no-api {staged_files}
          - name: zizmor
            glob: '.github/workflows/*.{yml,yaml}'
            run: mise exec -- zizmor {staged_files}
    - name: oxlint
      run: pnpm exec oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      glob:
        - '*.{js,mjs,cjs,jsx}'
        - '*.{ts,mts,cts,tsx}'
      stage_fixed: true
    - name: oxfmt
      run: pnpm exec oxfmt --write --no-error-on-unmatched-pattern {staged_files}
      glob:
        - '*.{js,mjs,cjs,jsx}'
        - '*.{ts,mts,cts,tsx}'
        - '*.{json,jsonc,json5}'
        - '*.{yaml,yml,toml}'
        - '*.{html,htm,vue,svelte}'
        - '*.{css,scss,less}'
        - '*.{md,markdown,mdx}'
      stage_fixed: true
    - name: markuplint
      run: pnpm exec markuplint {staged_files} --fix --problem-only
      glob:
        - '**/*.html'
        - '**/*.jsx'
        - '**/*.tsx'
      stage_fixed: true
    - name: stylelint
      run: pnpm exec stylelint {staged_files} --fix
      glob:
        - '**/*.css'
      stage_fixed: true
